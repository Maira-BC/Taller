openapi: 3.1.0
info: { title: API Turnos, version: 1.0.0 }
servers: [{ url: /api }]
paths:
  /usuarios:
   post:
    summary: Creación de funcionario
    security:
      - bearerAuth: []
    requestBody:
     required: true
     content:
      application/json:
       schema:
        type: object
        required: [nombre, correo, contrasena, rut]
        additionalProperties: false
        properties:
         nombre: { type: string }
         correo: { type: string, format: email }
         contrasena: { type: string, format: password, minLength: 8}
         rut: { type: string, pattern: '^\d{7,8}-[\dkK]$' }
    responses:
     '201': { description: Funcionario registrado correctamente }
     '400': { description: RUT inválido }
     '401': { description: Autenticación requerida o sesión inválida }
     '403': { description: Acceso no autorizado }
     '409': { description: Correo o RUT ya registrado }


  /login:
   post:
    summary: Inicio de sesión
    requestBody:
     required: true
     content:
      application/json:
       schema:
        type: object
        required: [correo, contrasena]
        additionalProperties: false
        properties:
         correo: { type: string, format: email }
         contrasena: { type: string, format: password, minLength: 8 }
    responses:
     '200': {description: OK}
     '401': { description: Credenciales inválidas}

  /sucursales:
    get:
      summary: Lista las sucursales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Sucursal' } }
  /modulos:
    get:
      summary: Lista los módulos de una sucursal
      parameters:
        - { name: sucursalId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { id: { type: integer }, numero: { type: integer }, sucursalId: { type: integer }, activo: { type: boolean } } } }
    post:
      summary: Crea un módulo en una sucursal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero, sucursalId]
              additionalProperties: false
              properties:
                numero: { type: integer, minimum: 1 }
                sucursalId: { type: integer }
      responses:
        '201':
          description: Módulo creado
  /modulos/{id}:
    patch:
      summary: Modifica un módulo
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                numero: { type: integer, minimum: 1 }
                activo: { type: boolean }
      responses:
        '200':
          description: Módulo actualizado
        '404': { description: Módulo no encontrado }
    delete:
      summary: Elimina un módulo si no está en atención
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Módulo eliminado }
        '409': { description: Módulo no encontrado o en uso }
  /turnos:
    get:
      summary: Lista los turnos de una sucursal
      parameters:
        - { name: sucursalId, in: query, required: true, schema: { type: integer } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/Estado' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Turno' } }
    post:
      summary: Genera un nuevo turno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, sucursalId]
              additionalProperties: false
              properties:
                tipo: { type: string, enum: [Matrícula, Finanzas, Becas, Asesoría] }
                sucursalId: { type: integer }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
  /turnos/{id}:
    patch:
      summary: Cambia el estado o el módulo de un turno
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                estado: { $ref: '#/components/schemas/Estado' }
                modulo: { type: [integer, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '404': { description: No existe }
  /eventos:
    get:
      summary: Avisa en tiempo real (Server-Sent Events) cuando cambian los turnos de una sucursal
      parameters: [{ name: sucursalId, in: query, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Flujo de eventos
          content:
            text/event-stream:
              schema: { type: string }
  /historial:
    get:
      summary: Eventos de turnos (desde MongoDB)
      parameters: [{ name: sucursalId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Evento' } }
  /historial/ultimo:
    get:
      summary: Último turno finalizado de una sucursal (público, para la pantalla de atención)
      parameters: [{ name: sucursalId, in: query, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK (null si aún no hay turnos finalizados)
          content:
            application/json:
              schema:
                type: [object, 'null']
                properties: { numero: { type: string }, modulo: { type: [integer, 'null'] } }

  /metricas:
    get:
      summary: Obtiene las métricas de turnos en una sucursal
      security:
        - bearerAuth: []
      parameters:
        - name: sucursalId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Métricas obtenidas correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEventos:
                    type: integer
                  totalTurnos:
                    type: integer
                  turnosConEspera:
                    type: integer
                  turnosConAtencion:
                    type: integer
                  promedioEspera:
                    type: [number, 'null']
                    description: Tiempo promedio de espera en minutos
                  promedioAtencion:
                    type: [number, 'null']
                    description: Tiempo promedio de atención en minutos
        '400':
          description: Sucursal inválida
        '401':
          description: Autenticación requerida o sesión inválida
        '403':
          description: Acceso no autorizado
        '500':
          description: Error al obtener las métricas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Estado: { type: string, enum: [espera, atendiendo, finalizado] }
    Sucursal:
      type: object
      properties: { id: {type: integer}, nombre: {type: string}, latitude: {type: number}, longitude: {type: number} }
    Turno:
      type: object
      properties:
        id: { type: integer }
        numero: { type: string }
        tipo: { type: string }
        estado: { $ref: '#/components/schemas/Estado' }
        modulo: { type: [integer, 'null'] }
        sucursalId: { type: integer }
    Evento:
      type: object
      properties:
        turnoId: { type: integer }
        sucursalId: { type: integer }
        numero: { type: string }
        tipo: { type: string }
        accion: { type: string, enum: [creado, llamado, finalizado] }
        modulo: { type: [integer, 'null'] }
        fecha: { type: string, format: date-time }